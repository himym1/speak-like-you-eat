name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run benchmark:dry-run
      - run: npm run benchmark:phase-2:dry-run
      - run: git diff --exit-code -- benchmark/manifest.json benchmark/phase-2-manifest.json
      - run: npm pack --dry-run --json
