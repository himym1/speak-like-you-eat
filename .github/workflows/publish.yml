name: Publish package

on:
  repository_dispatch:
    types:
      - publish-package
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wtfzambo/speak-like-you-eat'
    runs-on: ubuntu-latest
    steps:
      - id: tag
        name: Resolve and validate tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"
          else
            tag="$DISPATCH_TAG"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Tag must be a stable vX.Y.Z release tag."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          release_json="$RUNNER_TEMP/github-release.json"
          gh release view "$TAG" --repo "$REPOSITORY" --json tagName,isDraft,isPrerelease > "$release_json"

          TAG="$TAG" RELEASE_JSON="$release_json" node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const release = JSON.parse(await readFile(process.env.RELEASE_JSON, "utf8"));

          if (release.tagName !== process.env.TAG) {
            throw new Error(`GitHub Release tag must equal ${process.env.TAG}.`);
          }

          if (release.isDraft || release.isPrerelease) {
            throw new Error("GitHub Release must not be a draft or prerelease.");
          }
          NODE
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
      - name: Verify tag is on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"

          if [ "$head_commit" != "$tag_commit" ]; then
            echo "HEAD is not the $TAG tag commit."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$head_commit" origin/main; then
            echo "$TAG is not an ancestor of origin/main."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the trusted publishing npm CLI
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - name: Verify package versions
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const tagVersion = process.env.TAG.slice(1);
          const packageJson = JSON.parse(await readFile("package.json", "utf8"));
          const packageLock = JSON.parse(await readFile("package-lock.json", "utf8"));
          const versions = [packageJson.version, packageLock.version, packageLock.packages[""].version];

          if (versions.some((version) => version !== tagVersion)) {
            throw new Error(`Package versions must all equal ${tagVersion}.`);
          }
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm run benchmark:dry-run
      - run: npm run benchmark:phase-2:dry-run
      - run: git diff --exit-code -- benchmark/manifest.json benchmark/phase-2-manifest.json
      - run: npm pack --dry-run --json
      - name: Stop if this version already exists
        run: |
          package_name="$(node --input-type=module -e 'import p from "./package.json" with { type: "json" }; console.log(p.name)')"
          package_version="$(node --input-type=module -e 'import p from "./package.json" with { type: "json" }; console.log(p.version)')"

          existing_version="$RUNNER_TEMP/existing-version.json"
          npm_view_error="$RUNNER_TEMP/npm-view-error.log"

          if npm view "$package_name@$package_version" version --json > "$existing_version" 2> "$npm_view_error"; then
            echo "$package_name@$package_version already exists; npm versions are immutable."
            exit 1
          fi

          if ! grep -q 'E404' "$npm_view_error"; then
            cat "$npm_view_error"
            exit 1
          fi
      - run: npm publish --access public --tag latest
